<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kemuel Connect - Autenticação</title>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --input-bg: #1e293b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --error-color: #ef4444;
      --warning-color: #f59e0b;
      --success-color: #10b981;
    }

    body {
      background: linear-gradient(135deg, #090d16 0%, var(--bg-dark) 50%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      padding: 1.5rem;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.5rem 2rem 2rem 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header { text-align: center; margin-bottom: 2rem; }

    .logo-box {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    .header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; color: #fff; }
    .header p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; font-style: italic; }

    .alert {
      padding: 0.875rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      display: none;
      align-items: center;
      gap: 0.75rem;
      line-height: 1.3;
    }

    .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
    .alert-warning { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: #fde68a; }
    .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #a7f3d0; }

    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }

    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-wrapper i.input-icon { position: absolute; left: 1rem; color: var(--text-muted); pointer-events: none; width: 18px; height: 18px; }
    .input-wrapper input, .input-wrapper select {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .input-wrapper input:focus, .input-wrapper select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    .toggle-password {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
    }

    .checkbox-container { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-muted); }
    .forgot-link { color: var(--primary); text-decoration: none; font-weight: 500; }
    .forgot-link:hover { text-decoration: underline; }

    .btn {
      width: 100%;
      padding: 0.85rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--primary); color: #fff; margin-bottom: 0.75rem; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.05); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 2rem;
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; }

    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 1.25rem;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="header">
      <div class="logo-box">
        <i data-lucide="flame" style="width: 36px; height: 36px; color: #fff;"></i>
      </div>
      <h1>Kemuel Connect</h1>
      <p>"Os jovens pelos jovens, os jovens pela igreja, os jovens pelos seus semelhantes."</p>
    </div>

    <!-- Alertas -->
    <div id="alertBox" class="alert">
      <i id="alertIcon" data-lucide="alert-circle" style="width: 20px; height: 20px; flex-shrink: 0;"></i>
      <span id="alertText"></span>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <i data-lucide="mail" class="input-icon"></i>
          <input type="email" id="email" placeholder="seu.email@exemplo.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="password" placeholder="••••••••" required>
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', 'eyeIcon')">
            <i data-lucide="eye" id="eyeIcon" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" id="rememberMe">
          <span>Lembrar-me</span>
        </label>
        <a href="#" class="forgot-link" onclick="openForgotModal(event)">Esqueci minha senha</a>
      </div>

      <button type="submit" class="btn btn-primary" id="btnLogin">
        <span>Entrar</span>
        <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
      </button>

      <button type="button" class="btn btn-secondary" onclick="toggleView('register')">
        Criar conta
      </button>
    </form>

    <!-- FORMULÁRIO DE CRIAR CONTA (CADASTRO) -->
    <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="regName">Nome Completo</label>
        <div class="input-wrapper">
          <i data-lucide="user" class="input-icon"></i>
          <input type="text" id="regName" placeholder="Seu nome" required>
        </div>
      </div>

      <div class="form-group">
        <label for="regEmail">E-mail</label>
        <div class="input-wrapper">
          <i data-lucide="mail" class="input-icon"></i>
          <input type="email" id="regEmail" placeholder="seu.email@exemplo.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="regRole">Perfil</label>
        <div class="input-wrapper">
          <i data-lucide="shield" class="input-icon"></i>
          <select id="regRole" required>
            <option value="jovem">Jovem</option>
            <option value="secretario">Secretário</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="regPassword">Senha</label>
        <div class="input-wrapper">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="regPassword" placeholder="••••••••" minlength="6" required>
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('regPassword', 'regEyeIcon')">
            <i data-lucide="eye" id="regEyeIcon" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="btnRegister">
        <span>Cadastrar</span>
        <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>
      </button>

      <button type="button" class="btn btn-secondary" onclick="toggleView('login')">
        Já tenho uma conta
      </button>
    </form>

    <div class="footer">
      <p>&copy; Kemuel Connect. Todos os direitos reservados.</p>
      <p>Versão 1.0.0</p>
    </div>
  </div>

  <!-- Modal Esqueci Minha Senha -->
  <div id="forgotModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Recuperar Senha</h3>
        <button class="close-btn" onclick="closeForgotModal()">
          <i data-lucide="x" style="width: 20px; height: 20px;"></i>
        </button>
      </div>
      <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.25rem;">
        Digite seu e-mail cadastrado para receber o link de redefinição de senha.
      </p>
      <form onsubmit="handleForgotPassword(event)">
        <div class="form-group">
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="recoveryEmail" placeholder="seu.email@exemplo.com" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-bottom: 0;">Enviar Link</button>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // CONEXÃO COM O SUPABASE REAL
    const SUPABASE_URL = 'https://fhuooaoxwjsbgslrxzta.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZodW9vYW94d2pzYmdzbHJ4enRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEzNzIxNTksImV4cCI6MjA1Njk0ODE1OX0.qX3s-b2C2_c7Q4gX4b0s0E3_eZ-X9O8I9G_H7Z6X5Y4';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Alternar Telas (Login / Cadastro)
    function toggleView(view) {
      hideAlert();
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');

      if (view === 'register') {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
      } else {
        registerForm.style.display = 'none';
        loginForm.style.display = 'block';
      }
    }

    // Toggle Mostrar/Ocultar Senha
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);

      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    // Mensagens de Alerta
    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('alertBox');
      const alertText = document.getElementById('alertText');
      const alertIcon = document.getElementById('alertIcon');

      alertBox.className = `alert alert-${type}`;
      alertText.innerText = message;

      let iconName = 'alert-circle';
      if (type === 'warning') iconName = 'alert-triangle';
      if (type === 'success') iconName = 'check-circle';

      alertIcon.setAttribute('data-lucide', iconName);
      alertBox.style.display = 'flex';
      lucide.createIcons();
    }

    function hideAlert() {
      document.getElementById('alertBox').style.display = 'none';
    }

    // FLUXO 1: CRIAR CONTA (CADASTRO)
    async function handleRegister(e) {
      e.preventDefault();
      hideAlert();

      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const role = document.getElementById('regRole').value;

      const btn = document.getElementById('btnRegister');
      btn.disabled = true;
      btn.innerText = 'Cadastrando...';

      // 1. Criar usuário no Supabase Auth
      const { data, error } = await _supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: name,
            role: role,
            status: 'pendente' // Novo cadastro inicia como Pendente
          }
        }
      });

      btn.disabled = false;
      btn.innerHTML = '<span>Cadastrar</span><i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>';
      lucide.createIcons();

      if (error) {
        showAlert(error.message || 'Erro ao conectar com o servidor.', 'error');
        return;
      }

      showAlert('Cadastro realizado com sucesso! Seu cadastro está aguardando aprovação do administrador.', 'warning');
      setTimeout(() => toggleView('login'), 3000);
    }

    // FLUXO 2: LOGIN
    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.innerText = 'Entrando...';

      // Autenticar com o Supabase
      const { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      btn.disabled = false;
      btn.innerHTML = '<span>Entrar</span><i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>';
      lucide.createIcons();

      if (error) {
        showAlert('E-mail ou senha inválidos.', 'error');
        return;
      }

      const user = data.user;
      const userStatus = user.user_metadata?.status || 'pendente';
      const userRole = user.user_metadata?.role || 'jovem';

      // Verificar Regras de Aprovação
      if (userStatus === 'pendente') {
        showAlert('Seu cadastro ainda está aguardando aprovação do administrador.', 'warning');
        await _supabase.auth.signOut();
        return;
      }

      if (userStatus === 'recusado') {
        showAlert('Seu cadastro foi recusado. Entre em contato com a administração da igreja para mais informações.', 'error');
        await _supabase.auth.signOut();
        return;
      }

      showAlert('Login realizado com sucesso!', 'success');

      // Redirecionamento por Perfil
      setTimeout(() => {
        if (userRole === 'jovem') {
          alert('Redirecionando para a Área do Jovem...');
        } else {
          alert(`Redirecionando para o Painel Administrativo (${userRole})...`);
        }
      }, 1000);
    }

    // FLUXO 3: RECUPERAR SENHA
    function openForgotModal(e) { e.preventDefault(); document.getElementById('forgotModal').style.display = 'flex'; }
    function closeForgotModal() { document.getElementById('forgotModal').style.display = 'none'; }

    async function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('recoveryEmail').value.trim();

      const { error } = await _supabase.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://kemuelconnect777.vercel.app'
      });

      closeForgotModal();

      if (error) {
        showAlert('Erro ao enviar e-mail. Verifique se o endereço está correto.', 'error');
      } else {
        showAlert(`E-mail de redefinição enviado para ${email}! Verifique sua caixa de entrada/spam.`, 'success');
      }
    }
  </script>
</body>
</html>
