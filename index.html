<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kemuel Connect - Login</title>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* RESET & VARIAVEIS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --input-bg: #1e293b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --error-color: #ef4444;
      --warning-color: #f59e0b;
      --success-color: #10b981;
    }

    body {
      background: linear-gradient(135deg, #090d16 0%, var(--bg-dark) 50%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      padding: 1.5rem;
    }

    /* CONTAINER PRINCIPAL */
    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.5rem 2rem 2rem 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* CABEÇALHO */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-box {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      font-style: italic;
    }

    /* MENSAGENS E ALERTAS */
    .alert {
      padding: 0.875rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      display: none;
      align-items: center;
      gap: 0.75rem;
      line-height: 1.3;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
    .alert-warning { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: #fde68a; }
    .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #a7f3d0; }

    /* FORMULÁRIO */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i.input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      pointer-events: none;
      width: 18px;
      height: 18px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    .toggle-password {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-password:hover { color: var(--text-main); }

    /* OPÇÕES (Lembrar-me / Esqueci a senha) */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .checkbox-container input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      text-decoration: underline;
      color: #3b82f6;
    }

    /* BOTOES */
    .btn {
      width: 100%;
      padding: 0.85rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      margin-bottom: 0.75rem;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    /* MODAL ESQUECI MINHA SENHA */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .modal-header h3 { font-size: 1.2rem; }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* RODAPÉ */
    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 1.25rem;
    }

    .footer p { margin-bottom: 0.25rem; }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Cabeçalho -->
    <div class="header">
      <div class="logo-box">
        <i data-lucide="flame" style="width: 36px; height: 36px; color: #fff;"></i>
      </div>
      <h1>Kemuel Connect</h1>
      <p>"Os jovens pelos jovens, os jovens pela igreja, os jovens pelos seus semelhantes."</p>
    </div>

    <!-- Caixa de Alerta / Mensagens -->
    <div id="alertBox" class="alert">
      <i id="alertIcon" data-lucide="alert-circle" style="width: 20px; height: 20px; flex-shrink: 0;"></i>
      <span id="alertText"></span>
    </div>

    <!-- Formulário de Login -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <i data-lucide="mail" class="input-icon"></i>
          <input type="email" id="email" placeholder="seu.email@exemplo.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
            <i data-lucide="eye" id="eyeIcon" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" id="rememberMe">
          <span>Lembrar-me</span>
        </label>
        <a href="#" class="forgot-link" onclick="openForgotModal(event)">Esqueci minha senha</a>
      </div>

      <button type="submit" class="btn btn-primary" id="btnSubmit">
        <span>Entrar</span>
        <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
      </button>

      <button type="button" class="btn btn-secondary" onclick="goToRegister()">
        Criar conta
      </button>
    </form>

    <!-- Rodapé -->
    <div class="footer">
      <p>&copy; Kemuel Connect. Todos os direitos reservados.</p>
      <p>Versão 1.0.0</p>
    </div>
  </div>

  <!-- Modal Recuperação de Senha -->
  <div id="forgotModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Recuperar Senha</h3>
        <button class="close-btn" onclick="closeForgotModal()">
          <i data-lucide="x" style="width: 20px; height: 20px;"></i>
        </button>
      </div>
      <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.25rem;">
        Digite seu e-mail cadastrado para receber um link de redefinição de senha.
      </p>
      <form onsubmit="handleForgotPassword(event)">
        <div class="form-group">
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="recoveryEmail" placeholder="seu.email@exemplo.com" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-bottom: 0;">Enviar Link</button>
      </form>
    </div>
  </div>

  <script>
    // Inicialização dos Ícones Lucide
    lucide.createIcons();

    // Controle de Tentativas de Login e Inatividade (Segurança)
    let loginAttempts = 0;
    const MAX_ATTEMPTS = 5;
    let inactivityTimer;

    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      // Encerramento automático da sessão após 15 minutos de inatividade (exemplo)
      inactivityTimer = setTimeout(() => {
        showAlert('Sessão expirada por inatividade. Faça login novamente.', 'warning');
      }, 15 * 60 * 1000);
    }

    window.onload = resetInactivityTimer;
    document.onmousemove = resetInactivityTimer;
    document.onkeypress = resetInactivityTimer;

    // Toggle Mostrar/Ocultar Senha
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        passwordInput.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    // Exibição de Alertas do Sistema
    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('alertBox');
      const alertText = document.getElementById('alertText');
      const alertIcon = document.getElementById('alertIcon');

      alertBox.className = `alert alert-${type}`;
      alertText.innerText = message;

      let iconName = 'alert-circle';
      if (type === 'warning') iconName = 'alert-triangle';
      if (type === 'success') iconName = 'check-circle';

      alertIcon.setAttribute('data-lucide', iconName);
      alertBox.style.display = 'flex';
      lucide.createIcons();
    }

    function hideAlert() {
      document.getElementById('alertBox').style.display = 'none';
    }

    // Base de Usuários Mockada para teste dos fluxos exigidos
    const mockUsers = [
      { email: 'jovem@kemuel.com', pass: '123456', role: 'jovem', status: 'aprovado' },
      { email: 'admin@kemuel.com', pass: '123456', role: 'admin', status: 'aprovado' },
      { email: 'secretario@kemuel.com', pass: '123456', role: 'secretario', status: 'aprovado' },
      { email: 'pendente@kemuel.com', pass: '123456', role: 'jovem', status: 'pendente' },
      { email: 'recusado@kemuel.com', pass: '123456', role: 'jovem', status: 'recusado' }
    ];

    // Fluxo Principal de Login
    function handleLogin(event) {
      event.preventDefault();
      hideAlert();

      if (loginAttempts >= MAX_ATTEMPTS) {
        showAlert('Muitas tentativas malsucedidas. Bloqueado temporariamente por segurança.', 'error');
        return;
      }

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      // Validação básica
      if (!email || !password) {
        showAlert('E-mail ou senha inválidos.', 'error');
        return;
      }

      // Buscar Usuário
      const user = mockUsers.find(u => u.email === email);

      if (!user || user.pass !== password) {
        loginAttempts++;
        showAlert('E-mail ou senha inválidos.', 'error');
        return;
      }

      // Reset tentativas em caso de sucesso no e-mail/senha
      loginAttempts = 0;

      // Verificar Status do Cadastro
      if (user.status === 'pendente') {
        showAlert('Seu cadastro ainda está aguardando aprovação do administrador.', 'warning');
        return;
      }

      if (user.status === 'recusado') {
        showAlert('Seu cadastro foi recusado. Entre em contato com a administração da igreja para mais informações.', 'error');
        return;
      }

      if (user.status === 'aprovado') {
        showAlert('Login realizado com sucesso! Redirecionando...', 'success');

        // Direcionamento automático conforme o perfil
        setTimeout(() => {
          if (user.role === 'jovem') {
            window.location.href = '#area-do-jovem'; // Substituir pela rota real
            console.log('Redirecionado para Área do Jovem');
          } else if (user.role === 'admin' || user.role === 'secretario') {
            window.location.href = '#painel-administrativo'; // Substituir pela rota real
            console.log(`Redirecionado para Painel Administrativo (${user.role})`);
          }
        }, 1200);
      }
    }

    // Modal & Recuperação de Senha
    function openForgotModal(e) {
      e.preventDefault();
      document.getElementById('forgotModal').style.display = 'flex';
    }

    function closeForgotModal() {
      document.getElementById('forgotModal').style.display = 'none';
    }

    function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('recoveryEmail').value;
      closeForgotModal();
      showAlert(`Link de redefinição enviado com sucesso para ${email}!`, 'success');
    }

    // Criar Conta
    function goToRegister() {
      // Redireciona para a tela de cadastro (onde o status inicial será "pendente")
      window.location.href = '#cadastro';
      console.log('Redirecionando para a tela de cadastro...');
    }
  </script>
</body>
</html>
