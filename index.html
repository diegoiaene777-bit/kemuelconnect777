<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kemuel Connect 777 - Gestão JA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans antialiased">

    <!-- Container de Login / Autenticação -->
    <div id="login-container" class="min-h-screen flex items-center justify-center bg-indigo-950 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-indigo-950">Kemuel Connect 777</h1>
                <p class="text-gray-500 mt-2">Área de Acesso do Clube JA</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200">
                    Entrar
                </button>
            </form>
            <div id="login-error" class="mt-4 text-red-500 text-sm text-center hidden"></div>
        </div>
    </div>

    <!-- Container Principal do Aplicativo (Oculto inicialmente se não logado) -->
    <div id="app-container" class="hidden min-h-screen flex">
        
        <!-- Menu Lateral -->
        <aside class="w-64 bg-indigo-950 text-white flex flex-col justify-between p-4">
            <div>
                <div class="text-xl font-bold mb-8 px-2">Kemuel Connect</div>
                <nav class="space-y-2">
                    <a href="#" class="block px-4 py-2.5 rounded-lg bg-indigo-900 text-white">Calendário</a>
                    <a href="#" class="block px-4 py-2.5 rounded-lg hover:bg-indigo-900 text-gray-300">Ranking</a>
                    <a href="#" class="block px-4 py-2.5 rounded-lg hover:bg-indigo-900 text-gray-300">Desafios</a>
                    <a href="#" class="block px-4 py-2.5 rounded-lg hover:bg-indigo-900 text-gray-300">Evangelismo</a>
                    <a href="#" class="block px-4 py-2.5 rounded-lg hover:bg-indigo-900 text-gray-300">Configurações</a>
                </nav>
            </div>

            <!-- Botão Sair Corrigido -->
            <div class="pt-4 border-t border-indigo-900">
                <button id="btn-sair" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition duration-200">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </button>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="flex-1 p-8 overflow-y-auto">
            <h2 class="text-2xl font-bold text-gray-800">Painel Principal</h2>
            <p class="text-gray-600 mt-2">Bem-vindo ao sistema do clube!</p>
        </main>
    </div>

    <!-- Script de Inicialização e Lógica de Autenticação / Logout -->
    <script>
        // Substitua pelas suas credenciais reais do Supabase
        const SUPABASE_URL = ' SUA_SUPABASE_URL ';
        const SUPABASE_ANON_KEY = ' SUA_SUPABASE_ANON_KEY ';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Verifica estado da sessão ao carregar a página
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
            } else {
                document.getElementById('login-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        }

        // Função de Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorDiv.textContent = 'Erro ao entrar: ' + error.message;
                errorDiv.classList.remove('hidden');
            } else {
                errorDiv.classList.add('hidden');
                checkSession();
            }
        });

        // Função de Logout (Corrigida e acionada pelo botão)
        document.getElementById('btn-sair').addEventListener('click', async () => {
            try {
                const { error } = await supabase.auth.signOut();
                if (error) {
                    console.error('Erro ao sair:', error.message);
                }
            } catch (err) {
                console.error('Erro inesperado:', err);
            } finally {
                // Força a ocultação do painel e recarregamento limpo para a tela de login
                document.getElementById('app-container').classList.add('hidden');
                document.getElementById('login-container').classList.remove('hidden');
                window.location.reload();
            }
        });

        // Executa a verificação ao iniciar
        checkSession();
    </script>
</body>
</html>
