<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kemuel Connect 777 - Gestão JA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Header / Navbar -->
  <header class="bg-blue-800 text-white shadow-lg p-4 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">Kemuel Connect 777</h1>
      <span class="bg-blue-600 text-xs px-3 py-1 rounded-full font-semibold">Ministério Jovem</span>
    </div>
  </header>

  <!-- Container Principal -->
  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- Card de Boas-Vindas / Resumo -->
    <section class="bg-white rounded-xl shadow p-6 border-l-4 border-blue-600">
      <h2 class="text-2xl font-bold text-gray-800">Bem-vindo ao Painel JA! 👋</h2>
      <p class="text-sm text-gray-600 mt-1">Acompanhe seus pontos, presença e classificação na igreja.</p>
      
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-6">
        <div class="bg-blue-50 p-4 rounded-lg text-center">
          <span class="block text-xs font-medium text-blue-600 uppercase">Seus Pontos</span>
          <span class="text-3xl font-extrabold text-blue-900 mt-1 block" id="user-points">0</span>
        </div>
        <div class="bg-amber-50 p-4 rounded-lg text-center">
          <span class="block text-xs font-medium text-amber-600 uppercase">Sua Posição</span>
          <span class="text-3xl font-extrabold text-amber-900 mt-1 block" id="user-rank">#-</span>
        </div>
        <div class="bg-emerald-50 p-4 rounded-lg text-center col-span-2 md:col-span-1">
          <span class="block text-xs font-medium text-emerald-600 uppercase">Status Lição</span>
          <span class="text-sm font-bold text-emerald-800 mt-2 block">Em Dia 🔥</span>
        </div>
      </div>
    </section>

    <!-- Tabela de Ranking em Tempo Real -->
    <section class="bg-white rounded-xl shadow p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-800">🏆 Ranking dos Jovens</h3>
        <button onclick="carregarRanking()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded text-gray-600 transition">Atualizar</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
            <tr>
              <th class="p-3">Pos.</th>
              <th class="p-3">Jovem</th>
              <th class="p-3">Cargo</th>
              <th class="p-3 text-right">Pontos</th>
            </tr>
          </thead>
          <tbody id="ranking-body" class="divide-y">
            <tr>
              <td colspan="4" class="p-4 text-center text-gray-400">Carregando classificação...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Script Supabase Integrado -->
  <script>
    const SUPABASE_URL = 'https://fhuooaoxwjsbgslrxzta.supabase.co';
    // Cole sua Publishable Key no campo abaixo entre as aspas
    const SUPABASE_KEY = 'sb_publishable_iDqCZ6v4D0DHA2qlwAphfA_llKwhSTV';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function carregarRanking() {
      const tbody = document.getElementById('ranking-body');
      tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400">Carregando classificação...</td></tr>';

      const { data, error } = await _supabase
        .from('profiles')
        .select('nome, cargo, pontos_totais')
        .order('pontos_totais', { ascending: false });

      if (error || !data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400">Nenhum jovem cadastrado ainda.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      data.forEach((jovem, idx) => {
        const medalha = idx === 0 ? '🥇 ' : idx === 1 ? '🥈 ' : idx === 2 ? '🥉 ' : `${idx + 1}º`;
        tbody.innerHTML += `
          <tr class="hover:bg-gray-50">
            <td class="p-3 font-bold">${medalha}</td>
            <td class="p-3 font-semibold text-gray-800">${jovem.nome}</td>
            <td class="p-3 text-xs text-gray-500 capitalize">${jovem.cargo}</td>
            <td class="p-3 text-right font-bold text-blue-700">${jovem.pontos_totais} pts</td>
          </tr>
        `;
      });
    }

    document.addEventListener('DOMContentLoaded', carregarRanking);
  </script>
</body>
</html>
